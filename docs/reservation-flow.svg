<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1120" width="100%" height="100%" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color-scheme:dark;">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149"/>
    </marker>
  </defs>

  <style>
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8; }
    .card-decision { fill: #1f242c; stroke: #58a6ff; stroke-width: 1.5; rx: 8; }
    .card-lock { fill: #231f1a; stroke: #d29922; stroke-width: 1.5; rx: 8; }
    .card-success { fill: #12261a; stroke: #238636; stroke-width: 1.5; rx: 8; }
    .card-error { fill: #2b1718; stroke: #da3633; stroke-width: 1.5; rx: 8; }
    .txt-title { fill: #f0f6fc; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
    .txt-sub { fill: #8b949e; font-size: 11.5px; text-anchor: middle; }
    .txt-green { fill: #3fb950; font-size: 11.5px; font-weight: 600; }
    .txt-red { fill: #f85149; font-size: 11.5px; font-weight: 600; }
    .txt-blue { fill: #58a6ff; font-size: 11.5px; font-weight: 600; }
    .line { stroke: #8b949e; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .line-green { stroke: #3fb950; stroke-width: 1.5; fill: none; marker-end: url(#arrow-green); }
    .line-red { stroke: #f85149; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red); }
  </style>

  <!-- 1. Incoming Request -->
  <rect x="230" y="30" width="340" height="46" class="card"/>
  <text x="400" y="58" class="txt-title">POST /shows/:id/reserve</text>

  <path d="M 400 76 L 400 102" class="line"/>

  <!-- 2. Auth Check -->
  <rect x="245" y="104" width="310" height="46" class="card"/>
  <text x="400" y="132" class="txt-title">Extract Bearer Token Identity</text>

  <path d="M 400 150 L 400 176" class="line"/>

  <!-- 3. Zod Validation -->
  <rect x="245" y="178" width="310" height="46" class="card"/>
  <text x="400" y="206" class="txt-title">Zod Schema Validation</text>

  <path d="M 400 224 L 400 250" class="line"/>

  <!-- 4. Idempotency Pre-Check -->
  <rect x="220" y="252" width="360" height="52" class="card-decision"/>
  <text x="400" y="274" class="txt-title">Idempotency Pre-Check</text>
  <text x="400" y="292" class="txt-sub">Lookup (key, user_id) in database</text>

  <!-- Cache Hit Branch (Right) -->
  <path d="M 580 278 L 680 278" class="line-green"/>
  <text x="600" y="270" class="txt-green">Cache Hit</text>
  <rect x="682" y="252" width="160" height="52" class="card-success"/>
  <text x="762" y="274" class="txt-title">Replay 201</text>
  <text x="762" y="292" class="txt-sub">X-Idempotency: HIT</text>

  <path d="M 400 304 L 400 334" class="line"/>
  <text x="408" y="324" class="txt-blue">Miss</text>

  <!-- 5. Begin Transaction -->
  <rect x="245" y="336" width="310" height="46" class="card"/>
  <text x="400" y="364" class="txt-title">BEGIN PostgreSQL Transaction</text>

  <path d="M 400 382 L 400 408" class="line"/>

  <!-- 6. Advisory Lock -->
  <rect x="200" y="410" width="400" height="52" class="card-lock"/>
  <text x="400" y="432" class="txt-title">pg_advisory_xact_lock(user_id:show_id)</text>
  <text x="400" y="450" class="txt-sub">Serializes parallel attempts by the same user</text>

  <path d="M 400 462 L 400 492" class="line"/>

  <!-- 7. In-Transaction Idempotency Re-check -->
  <rect x="220" y="494" width="360" height="52" class="card-decision"/>
  <text x="400" y="516" class="txt-title">In-Transaction Idempotency Check</text>
  <text x="400" y="534" class="txt-sub">Catches races bypassing middleware</text>

  <!-- Re-check Hit Branch (Right) -->
  <path d="M 580 520 L 680 520" class="line-green"/>
  <text x="600" y="512" class="txt-green">Exists</text>
  <rect x="682" y="494" width="160" height="52" class="card-success"/>
  <text x="762" y="516" class="txt-title">Rollback &amp; 201</text>
  <text x="762" y="534" class="txt-sub">Return cached result</text>

  <path d="M 400 546 L 400 576" class="line"/>
  <text x="408" y="566" class="txt-blue">Safe</text>

  <!-- 8. Quota Check -->
  <rect x="210" y="578" width="380" height="52" class="card-decision"/>
  <text x="400" y="600" class="txt-title">Check Quota Limit</text>
  <text x="400" y="618" class="txt-sub">total_held + requested &lt;= per_user_limit</text>

  <!-- Quota Exceeded (Right) -->
  <path d="M 590 604 L 680 604" class="line-red"/>
  <text x="605" y="596" class="txt-red">Over Limit</text>
  <rect x="682" y="578" width="160" height="52" class="card-error"/>
  <text x="762" y="600" class="txt-title">Rollback &amp; 409</text>
  <text x="762" y="618" class="txt-sub">USER_LIMIT_EXCEEDED</text>

  <path d="M 400 630 L 400 660" class="line"/>
  <text x="408" y="650" class="txt-green">Within Limit</text>

  <!-- 9. Lock Seats FOR UPDATE -->
  <rect x="180" y="662" width="440" height="56" class="card-lock"/>
  <text x="400" y="685" class="txt-title">SELECT ... FOR UPDATE (ORDER BY seat_number ASC)</text>
  <text x="400" y="703" class="txt-sub">Deterministic locking order prevents deadlocks</text>

  <!-- Error Left: Missing Seats -->
  <path d="M 180 690 L 80 690 L 80 760" class="line-red"/>
  <text x="90" y="730" class="txt-red">Missing Seat</text>
  <rect x="10" y="762" width="160" height="52" class="card-error"/>
  <text x="90" y="784" class="txt-title">Rollback &amp; 400</text>
  <text x="90" y="802" class="txt-sub">SEATS_NOT_FOUND</text>

  <!-- Error Right: Seat Taken -->
  <path d="M 620 690 L 762 690 L 762 760" class="line-red"/>
  <text x="660" y="730" class="txt-red">Already Taken</text>
  <rect x="682" y="762" width="160" height="52" class="card-error"/>
  <text x="762" y="784" class="txt-title">Rollback &amp; 409</text>
  <text x="762" y="802" class="txt-sub">SEAT_ALREADY_TAKEN</text>

  <path d="M 400 718 L 400 762" class="line"/>
  <text x="408" y="744" class="txt-green">All Available</text>

  <!-- 10. Insert Reservation -->
  <rect x="220" y="764" width="360" height="46" class="card"/>
  <text x="400" y="792" class="txt-title">INSERT INTO reservations (show_id, user_id, amount)</text>

  <path d="M 400 810 L 400 840" class="line"/>

  <!-- 11. Update Seats -->
  <rect x="200" y="842" width="400" height="46" class="card"/>
  <text x="400" y="870" class="txt-title">UPDATE show_seats SET status = 'confirmed', reservation_id</text>

  <path d="M 400 888 L 400 918" class="line"/>

  <!-- 12. Save Idempotency Record -->
  <rect x="210" y="920" width="380" height="46" class="card"/>
  <text x="400" y="948" class="txt-title">INSERT INTO idempotency_records (user_id, key, payload)</text>

  <path d="M 400 966 L 400 996" class="line"/>

  <!-- 13. Commit -->
  <rect x="245" y="998" width="310" height="46" class="card-lock"/>
  <text x="400" y="1026" class="txt-title">COMMIT Transaction</text>

  <path d="M 400 1044 L 400 1068" class="line-green"/>

  <!-- 14. Return 201 -->
  <rect x="220" y="1070" width="360" height="46" class="card-success"/>
  <text x="400" y="1098" class="txt-title">Emit Prometheus Metrics &amp; Return 201 Created</text>
</svg>
